function run(n,fn){G.busy=true;fn(n).catch(function(e){return say(n,e===DIED?"The tide knocked you out. Talk to me to try again.":"Trouble: "+(e&&e.message||e))}).then(function(){G.busy=false})}

/* ---- dialog, loading, input ---- */

function wrap(s,n){var o=[];s.split("\n").forEach(function(p){var l="";p.split(" ").forEach(function(w){while(w.length>n){if(l){o.push(l);l=""}o.push(w.slice(0,n));w=w.slice(n)}

  if((l+" "+w).trim().length>n){o.push(l);l=w}else l=(l+" "+w).trim()});o.push(l)});return o}

function say(n,text,ch){return new Promise(function(res){var L=wrap(text,34),pg=[],k=ch?3:4;for(var i=0;i<L.length;i+=k)pg.push(L.slice(i,i+k));

  G.D={n:n.n,pg:pg,pi:0,t0:performance.now(),ch:ch||null,sel:0,res:res}})}

function cnt(D){return D.pg[D.pi].join("").length}

function adv(){var D=G.D;if(!D)return;var len=cnt(D),sh=RM?len:Math.floor((performance.now()-D.t0)/22);

  if(sh<len){D.t0=performance.now()-len*22;return}

  if(D.pi<D.pg.length-1){D.pi++;D.t0=performance.now();return}

  G.D=null;sfx(700,.03,"square",.03);D.res(D.ch?D.sel:0)}

function load(label,ms){return new Promise(function(res){G.L={label:label,t0:performance.now(),ms:RM?1:ms,res:res}})}

function until(test,label){return new Promise(function(res){var busy=0;G.L={label:label,t0:performance.now(),ms:0,last:0,poll:function(){if(busy)return;busy=1;

  snap().then(function(s){busy=0;if(test(s)){G.L=null;res(s)}}).catch(function(e){busy=0;if(G.L)G.L.label=String(e.message).slice(0,30)})}}})}

  function done(v){i.hidden=true;G.I=0;i.onkeydown=null;CV.focus();res(v)}

  i.onkeydown=function(e){e.stopPropagation();if(e.key==="Enter")done(i.value.trim());else if(e.key==="Escape")done("")}})}

  if(S.m>=5){S.done=true;G.end=1;G.hist=null;if(G.live)call("history").then(function(h){G.hist=h.slice(0,4)}).catch(function(){})}}

/* ---- quests ---- */

async function m0(n){

  await say(n,"Welcome, hero! barkd is my forge: it keeps your Ark coins. First we fill it from your on-chain wallet.");

        await call("send",{destination:d,amount_sat:5000});fee=await feeOf();await snap()}else{S.ark-=5010;fee="10 sat"}

async function m3(n){

/* ---- input ---- */

var KM={a:"ArrowLeft",d:"ArrowRight",w:"ArrowUp",s:"ArrowDown"};

function press(k){

  if(k==="q"){if(G.jr)G.jr=0;else if(!ui())G.jr=1;return}

  else if(k==="q"||k==="Q"||k==="Tab"){e.preventDefault();press("q")}

  else if(k==="m"||k==="M"){MUTE=!MUTE;toast(MUTE?"Sound off":"Sound on")}

[].forEach.call(document.querySelectorAll(".pad button"),function(b){var k=b.getAttribute("data-k"),a=b.getAttribute("data-a");

b.onpointerdown=function(e){e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=function(){delete keys[k]}});

/* ---- update ---- */

function update(dt){

  G.shake-=dt;G.fade-=dt;

  if(G.toast&&(G.toast.t-=dt)<=0)G.toast=null;

  FX=FX.filter(function(f){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;return f.t>0});

  if(G.L){var L=G.L,now=performance.now();if(L.poll&&now-L.last>1500){L.last=now;L.poll()}

    if(L.ms&&now-L.t0>=L.ms){G.L=null;L.res()}}

  if(ui())return;

  P.cd-=dt;P.atk-=dt;P.inv-=dt;

  if(S.hp<3&&(P.reg+=dt)>15){P.reg=0;S.hp++}

  if(P.t>0){P.t+=dt/.16;if(P.t>=1){P.x+=P.dx;P.y+=P.dy;P.t=0;P.dx=P.dy=0;doorCk()}}

  if(!P.t){var k=keys.ArrowLeft?[-1,0]:keys.ArrowRight?[1,0]:keys.ArrowUp?[0,-1]:keys.ArrowDown?[0,1]:null;if(k)step(k[0],k[1])}

  M.slice().forEach(function(m){

m.cd-=dt;m.hit-=dt;

    if(m.t>0){m.t+=dt/m.ty.step;if(m.t>=1){m.x+=m.dx;m.y+=m.dy;m.dx=m.dy=0;m.t=0;m.wait=.15+Math.random()*.4}return}

    var ax=P.x-m.x,ay=P.y-m.y;

    if(Math.abs(ax)+Math.abs(ay)===1){if(m.cd<=0&&P.inv<=0){S.hp--;G.shake=.25;sfx(110,.25,"sawtooth",.07);P.inv=1.1;m.cd=1.3;burst(P.x*T,P.y*T,"#d6453a");if(S.hp<1)die()}return}

    if((m.wait-=dt)>0)return;

    var o=[],r=Math.random();

    if(m.w||Math.abs(ax)+Math.abs(ay)<7)o=Math.abs(ax)>=Math.abs(ay)?[[Math.sign(ax),0],[0,Math.sign(ay)]]:[[0,Math.sign(ay)],[Math.sign(ax),0]];

    else if(r<.6)o=[[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)]];

    for(var i=0;i<o.length;i++)if((o[i][0]||o[i][1])&&mfree(m.x+o[i][0],m.y+o[i][1],m)){m.dx=o[i][0];m.dy=o[i][1];m.t=.0001;return}

m.wait=.3});

}

function render(ts){

  X.setTransform(2,0,0,2,G.shake>0&&!RM?(Math.random()-.5)*6:0,G.shake>0&&!RM?(Math.random()-.5)*6:0);

    if(q)tx("!",n.x*T+8,n.y*T-8+(RM?0:Math.round(Math.sin(ts/200)*2)),"#F5A524","center");

    if(near)tx("E: "+n.n,n.x*T+8,n.y*T-(q?17:10),"#fff","center")});

  X.restore();

  tx(lvl()+" "+S.xp+"xp",36,3,"#F5A524");

  if(G.toast)tx(G.toast.s,160,26,"#F5A524","center");

    var len=cnt(D),sh=RM?len:Math.floor((performance.now()-D.t0)/22),rem=sh,last=D.pi===D.pg.length-1;

    if(sh>=len){if(last&&D.ch)D.ch.forEach(function(c,i){tx((i===D.sel?"> ":"  ")+c,12,146+(D.pg[D.pi].length+i)*10+2,i===D.sel?"#F5A524":"#cfc6ae")});

      else if((ts/350|0)%2){R(X,"#F5A524",300,208,5,1);R(X,"#F5A524",301,209,3,1);R(X,"#F5A524",302,210,1,1)}}}

  if(G.L){box(30,150,260,40);tx(G.L.label,40,158);R(X,"#6b4a22",40,174,240,8);

    if(G.L.ms)R(X,"#F5A524",40,174,240*Math.min(1,(performance.now()-G.L.t0)/G.L.ms),8);else R(X,"#F5A524",40+((ts/8)%200),174,40,8)}

  if(G.I){box(4,150,312,40);tx(G.Il,12,156,"#F5A524");tx("Enter: confirm. Esc: cancel",12,194,"#8aa0ad")}

  if(G.end||G.jr){R(X,"rgba(8,16,28,.93)",0,0,320,224);

    tx(G.end?"You boarded the Ark!":"Journal",160,22,"#F5A524","center");tx(lvl()+", "+S.xp+" XP",160,38,"#fff","center");

    badgeList(62);if(G.jr)tx(hintTxt(),160,134,"#fff","center");

    tx(G.end?"E: play again":"Q: close",160,204,"#8aa0ad","center")}

  if(G.fade>0)R(X,"rgba(0,0,0,"+Math.min(1,G.fade/.3)+")",0,0,320,224)}

function frame(ts){requestAnimationFrame(frame);if(!S)return;var dt=Math.min(.05,(ts-(frame.l||ts))/1000);frame.l=ts;update(dt);render(ts)}
